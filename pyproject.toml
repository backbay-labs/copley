[project]
name = "copley"
version = "0.1.0"
description = "Copley: an open research project for small cyber decision models (Backbay Industries)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Backbay Industries" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.11,<3",
    "typer>=0.16,<1",
    "scikit-learn>=1.6,<2",
    "numpy>=2.0,<3",
    "pyyaml>=6.0.2,<7",
    "pysigma>=2.0.1,<3",
    "pysigma-backend-sqlite>=2.1.0,<3",
]

[project.optional-dependencies]
train = [
    "torch>=2.6,<3",
    "transformers>=5.0,<6",
    "safetensors>=0.5,<1",
    "tokenizers>=0.21,<1",
    "huggingface-hub>=1.0,<2",
]
serve = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
copley = "copley.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.12,<1",
    "mypy>=1.16,<3",
    "httpx>=0.28,<1",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
files = ["src/copley"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "sigma.*", "transformers.*", "tokenizers.*", "safetensors.*", "huggingface_hub.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "neural: requires the optional `train` extra (torch/transformers); runs fully offline",
    "serve: requires the optional `serve` extra (fastapi)",
]
